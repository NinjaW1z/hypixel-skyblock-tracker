<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyFlip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">SkyFlip <span id="conn" class="pill off">offline</span></div>
  <div class="stats" id="stats"></div>
  <button id="settingsBtn" class="ghost">Settings</button>
</header>

<section id="settings" class="panel hidden">
  <form id="settingsForm">
    <label>Min profit <input name="minProfit" type="number" min="0" step="1000"></label>
    <label>Min profit % <input name="minProfitPercent" type="number" min="0" step="1"></label>
    <label>Max price (0 = any) <input name="maxPrice" type="number" min="0" step="100000"></label>
    <label>Min sales/day (median) <input name="minSalesPerDay" type="number" min="0" step="0.5"></label>
    <label>Max key tier (0 exact … 4 loose) <input name="maxKeyTier" type="number" min="0" max="4" step="1"></label>
    <label class="chk"><input name="SNIPE" type="checkbox"> Snipe flips (vs lowest BIN)</label>
    <label class="chk"><input name="MEDIAN" type="checkbox"> Median flips (vs sold history)</label>
    <label class="chk"><input name="sound" type="checkbox"> Sound</label>
    <label>Blacklist item ids <input name="blacklist" placeholder="HYPERION, PET"></label>
    <label>Whitelist item ids <input name="whitelist" placeholder="leave empty for all"></label>
    <div class="row"><button type="submit">Save</button> <span id="saveMsg"></span></div>
  </form>
</section>

<main>
  <table id="flips">
    <thead><tr>
      <th>Age</th><th>Kind</th><th>Item</th><th>Price</th><th>Target</th><th>Profit</th><th>%</th><th>Sales/d</th><th>Risk</th><th>Lag</th><th></th>
    </tr></thead>
    <tbody></tbody>
  </table>
  <p id="empty" class="muted">Waiting for the next API refresh. Flips appear here within a second or two of Hypixel's cache update.</p>
</main>
<script src="app.js"></script>
</body>
</html>
